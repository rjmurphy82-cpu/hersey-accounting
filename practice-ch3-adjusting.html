ount": "Unearned Revenue", "debit": "36,000"}, {"account": "Service Revenue", "credit": "36,000"}]}}]}, {"label": "Problem 15", "tag": "Accrual", "heading": "Accrued Utilities", "date": "December 31, 2026", "given": [{"p": "The December electric bill of $1,865 is not received until January 8 and has not been recorded. The electricity was used during December. Record the adjusting entry."}], "reveals": [{"entry": {"title": "Dec. 31 - Adjusting Entry", "rows": [{"account": "Utilities Expense", "debit": "1,865"}, {"account": "Utilities Payable", "credit": "1,865"}]}}]}, {"label": "Problem 16", "tag": "Deferral", "heading": "Prepaid Advertising", "date": "October 1, 2026", "given": [{"p": "The company pays $9,600 for a 12-month advertising contract beginning October 1. Record the entry on the date of payment."}, {"p": "December 31, 2026: Record the adjusting entry for the advertising used up through December 31."}], "reveals": [{"entry": {"title": "Oct. 1 - Original Entry", "rows": [{"account": "Prepaid Advertising", "debit": "9,600"}, {"account": "Cash", "credit": "9,600"}]}}, {"lines": ["$9,600 / 12 x 3 months"], "entry": {"title": "Dec. 31 - Adjusting Entry", "rows": [{"account": "Advertising Expense", "debit": "2,400"}, {"account": "Prepaid Advertising", "credit": "2,400"}]}}]}, {"label": "Problem 17", "tag": "Accrual", "heading": "Interest on a Note Receivable", "date": "December 31, 2026", "given": [{"p": "On November 1, the company accepted a $60,000, 6%, six-month note receivable from a customer. No interest has been recorded. Record the adjusting entry for the interest earned through December 31."}], "reveals": [{"lines": ["$60,000 x 6% x 2/12"], "entry": {"title": "Dec. 31 - Adjusting Entry", "rows": [{"account": "Interest Receivable", "debit": "600"}, {"account": "Interest Revenue", "credit": "600"}]}}]}, {"label": "Problem 18", "tag": "Accrual", "heading": "Interest on a Note Payable", "date": "December 31, 2026", "given": [{"p": "On September 1, the company rtial-Year Depreciation", "date": "December 31, 2026", "given": [{"p": "A machine costing $54,000 was purchased on July 1, 2026. It has no salvage value and a six-year useful life, and the company uses straight-line depreciation. Record the adjusting entry for 2026."}], "reveals": [{"lines": ["$54,000 / 6 x 6/12"], "entry": {"title": "Dec. 31 - Adjusting Entry", "rows": [{"account": "Depreciation Expense - Mach.", "debit": "4,500"}, {"account": "Accum. Depreciation - Mach.", "credit": "4,500"}]}}]}, {"label": "Problem 22", "tag": "Deferral", "heading": "Prepaid Insurance", "date": "December 31, 2026", "given": [{"p": "Before adjustment, the Prepaid Insurance account shows a debit balance of $7,920. A review of the insurance policies shows that $2,640 of coverage is still unexpired at year end. Record the adjusting entry."}], "reveals": [{"lines": ["$7,920 - $2,640"], "entry": {"title": "Dec. 31 - Adjusting Entry", "rows": [{"account": "Insurance Expense", "debit": "5,280"}, {"account": "Prepaid Insurance", "credit": "5,280"}]}}]}, {"label": "Problem 23", "tag": "Accrual", "heading": "Accrued Commissions", "date": "December 31, 2026", "given": [{"p": "The sales staff earned $6,150 in commissions during December. The commissions will not be paid until January 10. Record the adjusting entry."}, {"p": "January 10, 2027: The company pays the $6,150 of December commissions on January 10. Record the payment."}], "reveals": [{"entry": {"title": "Dec. 31 - Adjusting Entry", "rows": [{"account": "Commissions Expense", "debit": "6,150"}, {"account": "Commissions Payable", "credit": "6,150"}]}}, {"entry": {"title": "Jan. 10 - Payment Entry", "rows": [{"account": "Commissions Payable", "debit": "6,150"}, {"account": "Cash", "credit": "6,150"}]}}]}, {"label": "Problem 24", "tag": "Deferral", "heading": "Unearned Subscription Revenue", "date": "September 1, 2026", "given": [{"p": "A magazine publisher collects $86,400 in cash for 24-month subscriptions beginning September 1. Record the entry on the date the cash is received."}, {"p": "December 31, 2026: Four of the 24 months of magazines have been delivered by year end. Record the adjusting entry."}], "reveals": [{"entry": {"title": "Sept. 1 - Original Entry", "rows": [{"account": "Cash", "debit": "86,400"}, {"account": "Unearned Subscription Revenue", "credit": "86,400"}]}}, {"lines": ["$86,400 x 4/24"], "entry": {"title": "Dec. 31 - Adjusting Entry", "rows": [{"account": "Unearned Subscription Rev.", "debit": "14,400"}, {"account": "Subscription Revenue", "credit": "14,400"}]}}]}, {"label": "Problem 25", "tag": "Accrual", "heading": "Challenge: Biweekly Payroll", "date": "December 31, 2026", "given": [{"p": "A company has 18 employees who earn a combined $3,150 each working day. Employees are paid every other Friday for the 10 working days just completed. The pay period runs December 28, 2026 through January 8, 2027, and December 31 falls on a Thursday. Record the adjusting entry."}, {"p": "January 8, 2027: Employees are paid for the full 10-day pay period on Friday, January 8. Record the payment."}], "reveals": [{"lines": ["4 days x $3,150"], "entry": {"title": "Dec. 31 - Adjusting Entry", "rows": [{"account": "Salaries Expense", "debit": "12,600"}, {"account": "Salaries Payable", "credit": "12,600"}]}}, {"lines": ["10 days x $3,150"], "entry": {"title": "Jan. 8 - Payment Entry", "rows": [{"account": "Salaries Expense", "debit": "18,900"}, {"account": "Salaries Payable", "debit": "12,600"}, {"account": "Cash", "credit": "31,500"}]}}]}]};
(function(){
"use strict";
const $=id=>document.getElementById(id);
const P=DECK.problems;
let i=0,shown=0;const seen=new Set();
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
let scale=Number(store.get("d214-scale"))||1;
function applyScale(){document.documentElement.style.setProperty("--scale",scale);store.set("d214-scale",scale)}
applyScale();
$("smaller").onclick=()=>{scale=Math.max(.85,+(scale-.1).toFixed(2));applyScale()};
$("bigger").onclick=()=>{scale=Math.min(1.6,+(scale+.1).toFixed(2));applyScale()};
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
function table(t){
  const w=el("div","tw"),tb=el("table");
  if(t.head){const tr=el("tr");t.head.forEach(h=>tr.appendChild(el("th",null,h)));const th=el("thead");th.appendChild(tr);tb.appendChild(th)}
  const body=el("tbody");const st=new Set((t.strike||[]).map(a=>a[0]+","+a[1]));
  (t.rows||[]).forEach((r,ri)=>{const tr=el("tr");r.forEach((c,ci)=>tr.appendChild(el("td",st.has(ri+","+ci)?"s":null,c)));body.appendChild(tr)});
  tb.appendChild(body);w.appendChild(tb);
  if(t.note){const box=el("div");box.appendChild(w);box.appendChild(el("div","tnote",t.note));return box}
  return w;
}
function entry(e){
  const box=el("div");if(e.title)box.appendChild(el("div","jt",e.title));
  const w=el("div","tw"),tb=el("table","journal");
  const hr=el("tr");["Account","Debit","Credit"].forEach(h=>hr.appendChild(el("th",null,h)));const th=el("thead");th.appendChild(hr);tb.appendChild(th);
  const body=el("tbody");
  (e.rows||[]).forEach(r=>{const cr=r.credit!=null&&r.credit!==""&&(r.debit==null||r.debit==="");const tr=el("tr");
    tr.appendChild(el("td","acct"+(cr?" cr":""),r.account));tr.appendChild(el("td","n",r.debit||""));tr.appendChild(el("td","n",r.credit||""));body.appendChild(tr)});
  tb.appendChild(body);w.appendChild(tb);box.appendChild(w);return box;
}
function block(b){
  if(b.p!=null)return el("p",null,b.p);
  if(b.q!=null)return el("p","q",b.q);
  if(b.list){const u=el("ul");b.list.forEach(x=>u.appendChild(el("li",null,x)));return u}
  if(b.table)return table(b.table);
  return el("div");
}
function reveal(r){
  const d=el("div","rv");if(r.label)d.appendChild(el("div","rl",r.label));
  if(r.lines){const l=el("div","lines");r.lines.forEach(x=>l.appendChild(el("div",null,x)));d.appendChild(l)}
  if(r.list){const u=el("ul");r.list.forEach(x=>u.appendChild(el("li",null,x)));d.appendChild(u)}
  if(r.table)d.appendChild(table(r.table));
  if(r.entry)d.appendChild(entry(r.entry));
  if(r.entries)r.entries.forEach(e=>d.appendChild(entry(e)));
  if(r.answer)d.appendChild(el("div","answer",r.answer));
  return d;
}
function strip(){
  const s=$("strip");s.innerHTML="";
  P.forEach((p,k)=>{const b=el("button",seen.has(k)?"seen":null,String(k+1));b.title=p.label+(p.heading?": "+p.heading:"");b.setAttribute("aria-label",b.title);if(k===i)b.setAttribute("aria-current","true");b.onclick=()=>go(k);s.appendChild(b)});
  const cur=s.children[i];if(cur)cur.scrollIntoView({block:"nearest",inline:"center"});
}
function render(){
  const p=P[i],h=$("head");h.innerHTML="";
  if(p.section)h.appendChild(el("div","section",p.section));
  h.appendChild(el("span","label",p.label));
  if(p.tag)h.appendChild(el("span","tag",p.tag));
  if(p.date)h.appendChild(el("span","date",p.date));
  const g=$("given");g.innerHTML="";
  if(p.heading)g.appendChild(el("h2",null,p.heading));
  p.given.forEach(b=>g.appendChild(block(b)));
  const rv=$("reveals");rv.innerHTML="";
  p.reveals.slice(0,shown).forEach(r=>rv.appendChild(reveal(r)));
  const n=p.reveals.length,left=n-shown;
  $("revealBtn").disabled=left===0;$("allBtn").disabled=left===0;$("resetBtn").disabled=shown===0;
  $("revealBtn").textContent=left===0?"All revealed":(shown===0?"Reveal":"Reveal next");
  $("left").textContent=n===0?"Nothing to reveal on this one.":left?`${left} step${left===1?"":"s"} left`:"";
  $("pos").textContent=`${i+1} of ${P.length}`;
  $("prevBtn").disabled=i===0;$("nextBtn").disabled=i===P.length-1;
  strip();
}
function go(k){i=Math.max(0,Math.min(P.length-1,k));shown=0;seen.add(i);try{history.replaceState(null,"","#p"+(i+1))}catch(_){}render();window.scrollTo({top:0})}
function advance(){if(shown<P[i].reveals.length){shown++;render();const r=$("reveals").lastElementChild;if(r)r.scrollIntoView({block:"nearest",behavior:"smooth"})}else if(i<P.length-1)go(i+1)}
$("revealBtn").onclick=advance;
$("allBtn").onclick=()=>{shown=P[i].reveals.length;render()};
$("resetBtn").onclick=()=>{shown=0;render()};
$("prevBtn").onclick=()=>go(i-1);
$("nextBtn").onclick=()=>go(i+1);
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(e.key===" "||e.key==="ArrowRight"||e.key==="Enter"){if(e.target.tagName==="BUTTON"&&e.key!=="ArrowRight")return;e.preventDefault();advance()}
  else if(e.key==="ArrowLeft"){e.preventDefault();go(i-1)}
  else if(e.key==="h"||e.key==="H"){shown=0;render()}
});
const m=/^#p(\d+)$/.exec(location.hash);go(m?(+m[1]-1):0);
})();
</script>
</body>
