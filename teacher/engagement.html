<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher | The Engagement</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="District 214 Accounting simulation: bid against a rival accounting firm to fix a client's internal controls and bank reconciliation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: brown masthead, step rail, one working column per step; slides are fixed-palette 16:9 boards sized in cqw */
:root{
  --bg:#F4F3F3; --paper:#FFFFFF; --ink:#111111; --muted:#5C5C5C; --line:#DEDCDC;
  --brown:#111111; --orange:#C1102F; --orange-ink:#B00E2A; --onbrown:#FFFFFF;
  --good:#2E7A4C; --good-bg:#E4F2E8; --bad:#B13A2A; --bad-bg:#F8E3DF; --warn:#9A6514; --warn-bg:#FBEFD8;
  --chip:#ECEAEA;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* slide palette: fixed in both themes */
  --s-cream:#F4F3F3; --s-paper:#FFFFFF; --s-brown:#111111; --s-orange:#C1102F; --s-ink:#111111; --s-muted:#5C5C5C; --s-line:#DEDCDC;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414; --paper:#1E1E1E; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333;
  --brown:#0B0B0B; --orange:#E0213F; --orange-ink:#FF5C70; --onbrown:#FFFFFF;
  --good:#6FCB91; --good-bg:#1C3324; --bad:#F08574; --bad-bg:#3A1D18; --warn:#E8B65A; --warn-bg:#3A2C12;
  --chip:#2A2A2A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141414; --paper:#1E1E1E; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333;
  --brown:#0B0B0B; --orange:#E0213F; --orange-ink:#FF5C70; --onbrown:#FFFFFF;
  --good:#6FCB91; --good-bg:#1C3324; --bad:#F08574; --bad-bg:#3A1D18; --warn:#E8B65A; --warn-bg:#3A2C12;
  --chip:#2A2A2A; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brown)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{background:var(--brown);color:var(--onbrown);border-bottom:4px solid var(--orange);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.home img{height:36px;display:block;border-radius:3px}
.mchip.sync-ok{border-color:#3FA66B;color:#9BE3B6}.mchip.sync-bad{border-color:#FF5C70;color:#FF8A99}
.bigcode{font-family:var(--display);font-size:clamp(64px,12vw,128px);line-height:1;letter-spacing:.08em;color:var(--orange-ink)}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.brand small{font-family:var(--display);letter-spacing:.18em;font-size:11px;color:#FF8A99;text-transform:uppercase}
.brand b{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.02em;text-transform:uppercase}
.mchip{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:4px 9px;white-space:nowrap}
.mchip.deck{background:var(--orange);border-color:var(--orange);color:#fff}
.mbtn{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--onbrown);border-radius:3px;padding:4px 10px;font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mbtn:hover{background:rgba(255,255,255,.08)}

/* step rail */
.rail{background:var(--paper);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
.rail button{flex:0 0 auto;border:1px solid transparent;background:none;border-radius:3px;padding:6px 10px;display:flex;gap:8px;align-items:baseline;color:var(--muted);font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.rail button .n{font-family:var(--mono);font-size:12px}
.rail button.on{background:var(--brown);color:var(--onbrown)}
.rail button.done{color:var(--good)}
.rail button.done.on{color:var(--onbrown)}
.rail button:disabled{opacity:.4;cursor:not-allowed}

main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,42px)}
h2{font-size:24px}
h3{font-size:17px;letter-spacing:.05em}
p{margin:0}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--orange-ink)}
.lede{color:var(--muted);max-width:68ch}
.stack{display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.pace{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.pace i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid2>*{min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.sticky{position:sticky;top:90px}
@media (max-width:860px){.sticky{position:static}}
.btn{border:1px solid var(--brown);background:var(--brown);color:var(--onbrown);border-radius:3px;padding:9px 16px;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.or{background:var(--orange);border-color:var(--orange);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted)}
.ok{color:var(--good)} .no{color:var(--bad)}
.tag{display:inline-block;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:11px;padding:2px 7px;border-radius:2px;background:var(--chip);color:var(--muted)}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.or{background:var(--orange);color:#fff}
input[type=text],input[type=password],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%}
textarea{font-family:var(--mono);font-size:12px;min-height:90px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}

/* home */
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pair{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.pair .ph{padding:12px 14px;border-bottom:1px solid var(--line)}
.pair .ph b{font-family:var(--display);text-transform:uppercase;font-size:17px;display:block;line-height:1.15}
.pair .ph span{font-size:13px;color:var(--muted)}
.pair .gb{display:grid;grid-template-columns:1fr 1fr}
.pair .gb button{border:0;background:none;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border-right:1px solid var(--line)}
.pair .gb button:last-child{border-right:0}
.pair .gb button:hover{background:var(--chip)}
.pair .gb b{font-family:var(--display);font-size:22px}
.pair .gb small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* client file */
.folder{position:relative;margin-top:18px}
.folder .tab{position:absolute;top:-26px;left:0;background:var(--brown);color:var(--onbrown);font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;padding:5px 14px;border-radius:4px 4px 0 0}
.folder .body{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--brown);border-radius:0 4px 4px 4px;padding:20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.facts div{border-left:3px solid var(--orange);padding-left:10px}
.facts small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.facts b{font-family:var(--display);font-size:18px;font-weight:500}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 14px}
.quote p{font-style:italic}
.quote small{color:var(--muted);font-size:13px}
.fin{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.fin td{padding:4px 0;border-bottom:1px dotted var(--line)}
.fin td:last-child{text-align:right;font-family:var(--mono)}
.fin tr.t td{font-weight:700;border-bottom:1px solid var(--ink)}
.fin tr.h td{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted);padding-top:12px;border:0}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.rival{border:1px dashed var(--orange);background:transparent}

/* bank rec */
.recwrap{overflow-x:auto}
.rec{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.rec th{text-align:left;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.rec td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rec td.amt{font-family:var(--mono);text-align:right;white-space:nowrap}
.rec select{min-width:150px;padding:6px}
.rec tr.wrong td{background:var(--bad-bg)}
.rec tr.right td{background:var(--good-bg)}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.ledger{grid-template-columns:1fr}}
.ledger .side{border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--paper)}
.ledger table{width:100%;font-family:var(--mono);font-size:13px;border-collapse:collapse}
.ledger td{padding:3px 0}
.ledger td:last-child{text-align:right}
.ledger tr.adj td{border-top:2px solid var(--ink);font-weight:600;padding-top:6px}
.gap{margin-top:14px;padding:16px;border-radius:4px;background:var(--brown);color:var(--onbrown);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.gap .num{display:block;font-family:var(--display);font-size:38px;color:#FF8A99;line-height:1}
.gap p{max-width:60ch}

/* walkthrough */
.obs{counter-reset:o;display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.obs li{counter-increment:o;display:grid;grid-template-columns:28px 1fr;gap:6px;font-size:15px}
.obs li::before{content:counter(o);font-family:var(--mono);font-size:12px;color:var(--orange-ink);padding-top:2px}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.wk button{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.wk button .box{flex:0 0 18px;height:18px;border:2px solid var(--muted);border-radius:3px;margin-top:2px;display:grid;place-items:center;font-size:12px;color:#fff}
.wk button.sel{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.wk button.sel .box{background:var(--orange);border-color:var(--orange)}
.wk button b{display:block;font-weight:600;line-height:1.25}
.wk button small{color:var(--muted);font-size:13px}
.wk button.res-hit{border-color:var(--good);background:var(--good-bg)}
.wk button.res-miss{border-color:var(--warn);background:var(--warn-bg)}
.wk button.res-false{border-color:var(--bad);background:var(--bad-bg)}
.wk button:disabled{cursor:default}

/* fixes */
.fix{border:1px solid var(--line);border-radius:4px;background:var(--paper);overflow:hidden}
.fix .fh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fix .opts{display:flex;flex-direction:column}
.fix .opts button{text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px 10px 40px;position:relative}
.fix .opts button:last-child{border-bottom:0}
.fix .opts button::before{content:"";position:absolute;left:14px;top:13px;width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.fix .opts button.sel{background:var(--chip)}
.fix .opts button.sel::before{border-color:var(--orange);background:radial-gradient(var(--orange) 45%,transparent 50%)}

/* pricing */
.svc{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.svc th{text-align:left;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.svc td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.svc td.num{font-family:var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.svc tr.off td:not(:first-child){opacity:.45}
.svc tr.off input[type=range]{pointer-events:none}
.svc input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange)}
.svc input[type=range]{width:100%;min-width:120px;accent-color:var(--orange)}
.svc .nm{font-weight:600;line-height:1.25}
.svc .ds{font-size:12px;color:var(--muted)}
.pricewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.mg{font-family:var(--mono);font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14px;line-height:1.35}
.checks li .ic{font-weight:700}
.checks li small{display:block;color:var(--muted);font-size:12px}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.tot b{font-family:var(--mono);text-align:right}
.tot .big{font-family:var(--display);font-size:22px;text-transform:uppercase}
.stamp{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;padding:8px 10px;border-radius:3px;text-align:center;font-size:15px}
.stamp.ok{background:var(--good-bg);color:var(--good);border:1px solid var(--good)}
.stamp.no{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}

/* value prop chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:8px 12px;text-align:left;max-width:100%;line-height:1.3}
.chips button.sel{background:var(--brown);color:var(--onbrown);border-color:var(--brown)}

/* deck */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.thumb{display:flex;flex-direction:column;gap:6px}
.thumb .cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.thumb .slide{border:1px solid var(--line);border-radius:3px;cursor:pointer}
.codebox{display:flex;flex-direction:column;gap:8px}

/* slides */
.slide{aspect-ratio:16/9;width:100%;max-width:100%;container-type:inline-size;background:var(--s-cream);color:var(--s-ink);position:relative;overflow:hidden;font-family:var(--body)}
.slide *{margin:0}
.s-band{position:absolute;inset:0 0 auto 0;height:1.1cqw;background:var(--s-orange)}
.s-in{position:absolute;inset:4.5cqw 5cqw 4.2cqw 5cqw;display:flex;flex-direction:column;gap:2cqw}
.s-eye{font-family:var(--display);text-transform:uppercase;letter-spacing:.22em;font-size:1.25cqw;color:var(--s-orange)}
.s-h{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:3.8cqw;line-height:1.05;color:var(--s-brown);text-wrap:balance}
.s-p{font-size:1.65cqw;line-height:1.4}
.s-foot{position:absolute;left:5cqw;right:5cqw;bottom:1.6cqw;display:flex;justify-content:space-between;font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:1cqw;color:var(--s-muted)}
.s-cards{display:grid;gap:1.6cqw;flex:1;min-height:0}
.s-card{background:var(--s-paper);border:.12cqw solid var(--s-line);border-top:.5cqw solid var(--s-brown);padding:1.6cqw;display:flex;flex-direction:column;gap:.9cqw;min-width:0}
.s-card b{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:1.9cqw;line-height:1.1;color:var(--s-brown)}
.s-card span{font-size:1.4cqw;line-height:1.35;color:var(--s-muted)}
.s-card i{font-size:1.45cqw;line-height:1.35}
.s-big{font-family:var(--display);font-size:4.6cqw;line-height:1;color:var(--s-brown);font-variant-numeric:tabular-nums}
.s-big.or{color:var(--s-orange)}
.s-lab{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:1.15cqw;color:var(--s-muted)}
.s-tbl{width:100%;border-collapse:collapse;font-size:1.4cqw}
.s-tbl td{padding:.7cqw .6cqw;border-bottom:.1cqw solid var(--s-line);vertical-align:top;line-height:1.3}
.s-tbl td:first-child{font-weight:600;color:var(--s-brown);width:34%}
.s-tbl td.m{font-family:var(--mono);text-align:right;white-space:nowrap;width:1%}
.s-tbl tr.t td{border-top:.25cqw solid var(--s-brown);border-bottom:0;font-weight:700}
.s-title{position:absolute;inset:0;display:grid;grid-template-columns:42% 58%}
.s-title .l{background:var(--s-brown);color:#FFFFFF;padding:5cqw 4cqw;display:flex;flex-direction:column;justify-content:space-between}
.s-title .r{padding:5cqw 5cqw;display:flex;flex-direction:column;justify-content:center;gap:2cqw}
.s-wait{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(135deg,var(--s-cream) 0 1.2cqw,#E8E6E6 1.2cqw 2.4cqw);color:var(--s-muted);font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:2cqw;padding:4cqw}
.gantt{display:flex;flex-direction:column;gap:.9cqw;font-size:1.35cqw}
.gantt .gr{display:grid;grid-template-columns:30% 1fr;gap:1.2cqw;align-items:center}
.gantt .track{position:relative;height:2.2cqw;background:var(--s-paper);border:.1cqw solid var(--s-line)}
.gantt .bar{position:absolute;top:0;bottom:0;background:var(--s-brown)}
.gantt .bar.rec{background:var(--s-orange)}
.gantt .axis{display:grid;grid-template-columns:30% 1fr;gap:1.2cqw}
.gantt .ticks{display:grid;grid-template-columns:repeat(12,1fr);font-family:var(--mono);font-size:1cqw;color:var(--s-muted)}

/* present */
body.presenting #tsz{display:none!important}
.present{position:fixed;inset:0;z-index:50;background:#0A0A0A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.present .stage{width:min(100vw,calc((100vh - 56px) * 16 / 9));max-width:100%}
.present .ctl{display:flex;gap:10px;align-items:center;color:#EEEEEE;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.present .ctl button{background:transparent;border:1px solid #555555;color:#EEEEEE;border-radius:3px;padding:6px 12px;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em}

/* teacher */
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th,.tt td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tt th{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted)}
.tt td.m{font-family:var(--mono);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

/* ===================== LIVE SYNC (/api/live, same backend as Bank Rec Live) ===================== */
let syncState="off",syncT=null;
async function liveCall(op,path,v){const r=await fetch("/api/live",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op,path,v})});const j=await r.json().catch(()=>({}));return {status:r.status,ok:r.ok,j};}
function queueSync(){
  if(ROLE==="teacher"||!S.group)return;
  const c=(S.code||"").trim();
  if(!c){syncState="off";return;}
  if(!/^\d{4}$/.test(c)){syncState="bad";return;}
  clearTimeout(syncT);syncT=setTimeout(doSync,1000);
}
async function doSync(){
  try{
    const sl=slideList(S);
    const res=await liveCall("set",`games/${S.code.trim()}/players/g${S.group}`,{kind:"engagement",code:encode(S),step:S.step,ready:sl.filter(x=>x.ready).length,of:sl.length,ok:mgmtOK(S),firm:firmName(S),members:S.members.filter(Boolean),t:Date.now()});
    syncState=res.ok?"ok":(res.status===404?"nogame":"err");
  }catch(e){syncState="err";}
  paintMast();
  const sm=$("#syncMsg");if(sm)sm.innerHTML=syncNote();
}
function syncNote(){
  if(syncState==="ok")return '<span class="ok">Synced. Your teacher can open your deck on the projector.</span>';
  if(syncState==="nogame")return '<span class="no">No class session with that code. Check the code on the board.</span>';
  if(syncState==="err")return '<span class="no">Not synced right now. Your work is still saved on this device, and the pitch code below is your backup.</span>';
  if(syncState==="bad")return '<span class="no">The class code is 4 digits.</span>';
  return "Optional. Type the code on the board so your deck shows up on the teacher screen.";
}

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");
const pct=n=>(isFinite(n)?(n*100).toFixed(1):"0.0")+"%";
const clientOf=g=>CLIENTS[Math.ceil(g/2)-1];
const firmOf=g=>FIRMS[g%2?"A":"B"];
const rivalOf=g=>g%2?g+1:g-1;
const firmName=s=>(s.firm||"").trim()||firmOf(s.group).defName;
const roundTo=(n,step)=>Math.round(n/step)*step;
const ceilTo=(n,step)=>Math.ceil(n/step)*step;

function recCalc(c,ans){
  let bank=c.rec.bank,book=c.rec.book;
  c.rec.items.forEach((it,i)=>{const a=ans[i]; if(!a)return; const v=it[1];
    if(a==="bank+")bank+=v; if(a==="bank-")bank-=v; if(a==="book+")book+=v; if(a==="book-")book-=v;});
  return {bank,book,gap:book-bank};
}
function recTruth(c){const ans={};c.rec.items.forEach((it,i)=>ans[i]=it[2]);return recCalc(c,ans);}

function svcHours(s,svc){const c=clientOf(s.group),f=firmOf(s.group);return Math.round(svc.h*c.size*(f.mult[svc.id]||1)*10)/10;}
function svcCost(s,svc){const f=firmOf(s.group);return svcHours(s,svc)*(svc.partner?f.partnerRate:f.rate);}
function svcStep(svc){return svc.type==="setup"?50:10;}
function svcRange(s,svc){const c=svcCost(s,svc),st=svcStep(svc);return {min:ceilTo(c,st),max:ceilTo(c*3,st),def:roundTo(c*1.6,st)};}
function svcPrice(s,svc){const p=s.price[svc.id];return p==null?svcRange(s,svc).def:p;}

function quote(s){
  const f=firmOf(s.group),c=clientOf(s.group);
  const lines=SERVICES.filter(v=>s.sel[v.id]).map(v=>({v,h:svcHours(s,v),cost:svcCost(s,v),price:svcPrice(s,v)}));
  const setup=lines.filter(l=>l.v.type==="setup"),recur=lines.filter(l=>l.v.type==="recur");
  const sum=(a,k)=>a.reduce((t,l)=>t+l[k],0);
  const setupCost=sum(setup,"cost"),setupPrice=sum(setup,"price");
  const recurCost=sum(recur,"cost")+(recur.length?f.platform:0),recurPrice=sum(recur,"price"),recurHours=sum(recur,"h");
  const firstYear=setupPrice+recurPrice*12;
  return {lines,setup,recur,setupCost,setupPrice,recurCost,recurPrice,recurHours,firstYear,
    setupMargin:setupPrice?(setupPrice-setupCost)/setupPrice:0, recurMargin:recurPrice?(recurPrice-recurCost)/recurPrice:0,
    pctRev:(recurPrice*12)/c.fin.rev, fyPctRev:firstYear/c.fin.rev};
}
function mgmt(s){
  const f=firmOf(s.group),q=quote(s),out=[];
  out.push({l:"Monthly bank reconciliation included",ok:!!s.sel.monthrec});
  if(q.setup.length) out.push({l:`Setup margin at least ${f.setupFloor*100}%`,ok:q.setupMargin>=f.setupFloor-1e-9,d:"Currently "+pct(q.setupMargin)});
  out.push({l:`Monthly margin at least ${f.recurFloor*100}%`,ok:q.recur.length>0&&q.recurMargin>=f.recurFloor-1e-9,d:"Currently "+pct(q.recurMargin)+(f.platform?" (after $"+f.platform+" platform cost)":"")});
  if(f.minMonthly) out.push({l:`Monthly fee at least ${money(f.minMonthly)}`,ok:q.recurPrice>=f.minMonthly,d:"Currently "+money(q.recurPrice)});
  if(f.maxHours) out.push({l:`No more than ${f.maxHours} hours a month`,ok:q.recurHours<=f.maxHours,d:"Currently "+q.recurHours.toFixed(1)+" hours"});
  out.push({l:"No audit for a client we advise (independence)",ok:!s.sel.audit});
  out.push({l:"Recurring fees at or below 2.5% of client revenue",ok:q.pctRev<=0.025+1e-9,d:"Currently "+pct(q.pctRev)});
  return out;
}
const mgmtOK=s=>mgmt(s).every(x=>x.ok);

function headlineSuggest(s){
  const c=clientOf(s.group),f=firmOf(s.group);
  const p=c.prios.find(x=>x.id===s.prios[0]);const st=f.strengths.find(x=>x.id===s.strengths[0]);
  if(!p) return `Clean books and real controls for ${c.name}`;
  return `${p.t}, with ${st?st.t.charAt(0).toLowerCase()+st.t.slice(1):"a partner who knows your business"}`;
}
function stepDone(s,i){
  switch(i){
    case 0:return s.maxStep>0;
    case 1:return s.rec.done;
    case 2:return s.flagsDone;
    case 3:return s.flagsDone&&clientOf(s.group).weak.every(k=>s.fixes[k]!=null);
    case 4:return mgmtOK(s);
    case 5:return s.prios.length===3&&s.strengths.length===2&&!!s.rivalW;
    case 6:return false;
  }
}

  // 2 heard
  const ps=s.prios.map(id=>c.prios.find(p=>p.id===id)).filter(Boolean);
  out.push({name:"What we heard",ready:ps.length===3,html:ps.length===3?`<div class="s-in"><div class="s-eye">What we heard</div><div class="s-h">${esc(first)} told us three things matter most</div><div class="s-cards" style="grid-template-columns:repeat(3,1fr)">${ps.map(p=>`<div class="s-card"><b>${esc(p.t)}</b>${p.q?`<i>"${esc(p.q)}"</i>`:`<span>A goal we will plan around.</span>`}</div>`).join("")}</div></div>${foot}`:wait("Finish Value prop to build this slide")});
  // 3 found

  // 4 gaps
  out.push({name:"Control gaps",ready:s.flagsDone,html:s.flagsDone?`<div class="s-in"><div class="s-eye">Control gaps</div><div class="s-h">${c.weak.length} gaps put your cash at risk</div><table class="s-tbl">${c.weak.map(k=>`<tr><td>${esc(W[k].n)}</td><td>${esc(W[k].r)}</td></tr>`).join("")}</table></div>${foot}`:wait("Finish the Walkthrough to build this slide")});
  // 5 plan
  const fixReady=s.flagsDone&&c.weak.every(k=>s.fixes[k]!=null);
  out.push({name:"Our plan",ready:fixReady,html:fixReady?`<div class="s-in"><div class="s-eye">Our recommendations</div><div class="s-h">How we close each gap</div><table class="s-tbl">${c.weak.map(k=>`<tr><td>${esc(W[k].n)}</td><td>${esc(W[k].fix[s.fixes[k]])}</td></tr>`).join("")}</table></div>${foot}`:wait("Choose your Fixes to build this slide")});
  // 6 investment
  const hasPrice=q.recur.length>0;
  out.push({name:"Investment",ready:hasPrice,warn:hasPrice&&!mgmtOK(s),html:hasPrice?`<div class="s-in"><div class="s-eye">Your investment</div><div class="s-cards" style="grid-template-columns:1fr 1fr;flex:1"><div class="s-card"><span class="s-lab">One-time setup</span><table class="s-tbl">${q.setup.length?q.setup.map(l=>`<tr><td style="width:auto">${esc(l.v.n)}</td><td class="m">${money(l.price)}</td></tr>`).join(""):`<tr><td>No setup work</td><td class="m">$0</td></tr>`}<tr class="t"><td>Setup total</td><td class="m">${money(q.setupPrice)}</td></tr></table></div><div class="s-card"><span class="s-lab">Monthly service</span><table class="s-tbl">${q.recur.map(l=>`<tr><td style="width:auto">${esc(l.v.n)}</td><td class="m">${money(l.price)}</td></tr>`).join("")}<tr class="t"><td>Per month</td><td class="m">${money(q.recurPrice)}</td></tr></table></div></div><div style="display:flex;gap:3cqw;align-items:flex-end;background:var(--s-brown);color:#FFFFFF;padding:1.6cqw 2cqw;margin:0 -0cqw"><div><div class="s-lab" style="color:#D9D9D9">First-year investment</div><div class="s-big" style="color:#FF8A99">${money(q.firstYear)}</div></div><div class="s-p" style="font-size:1.4cqw">${esc(f.contract)}<br>About ${pct(q.fyPctRev)} of annual revenue in year one</div></div></div>${foot}`:wait("Build your price in Price it")});

  // 8 timeline
  const ph=q.setup.filter(l=>PHASES[l.v.id]);
  out.push({name:"First 90 days",ready:hasPrice,html:hasPrice?`<div class="s-in"><div class="s-eye">First 90 days</div><div class="s-h">What happens after you say yes</div><div class="gantt">${ph.map(l=>{const[a,b]=PHASES[l.v.id];return `<div class="gr"><span>${esc(l.v.n)}</span><div class="track"><div class="bar" style="left:${(a-1)/12*100}%;width:${(b-a+1)/12*100}%"></div></div></div>`}).join("")}<div class="gr"><span><b>Monthly service begins</b></span><div class="track"><div class="bar rec" style="left:${(Math.max(4,...ph.map(l=>PHASES[l.v.id][1]))<=8?4:8)/12*100}%;right:0"></div></div></div><div class="axis"><span></span><div class="ticks">${Array.from({length:12},(_,i)=>`<span>Wk ${i+1}</span>`).join("")}</div></div></div></div>${foot}`:wait("Build your price in Price it")});
  // 9 close
  out.push({name:"Close",ready:true,html:`<div class="s-title" style="grid-template-columns:1fr"><div class="l" style="justify-content:center;gap:2cqw;padding:6cqw"><div class="s-eye" style="color:#FF8A99">${esc(name)}</div><div style="font-family:var(--display);font-size:6cqw;line-height:1;text-transform:uppercase;font-weight:600">Let's get your books clean.</div><div style="font-size:1.7cqw;opacity:.85">Questions for us, ${esc(first)}?</div><div style="font-size:1.4cqw;opacity:.75">${members.map(esc).join(" · ")}</div></div></div><div class="s-band" style="top:auto;bottom:0"></div>`});
  return out;
}

function paintMast(){

    const sl=slideList(S),n=sl.filter(x=>x.ready).length;
    $("#mGroup").innerHTML=`<span class="mchip">Group ${S.group} · ${esc(clientOf(S.group).name)}</span>`;
    $("#mDeck").innerHTML=`<span class="mchip deck">Deck ${n}/${sl.length} slides ready</span>`;
  } else {$("#mGroup").innerHTML="";$("#mDeck").innerHTML="";}
  const sy=$("#mSync"),SYM={ok:["sync-ok","Synced to class"],nogame:["sync-bad","Class code not found"],err:["sync-bad","Not synced"],bad:["sync-bad","Check class code"]};
  sy.innerHTML=(view==="group"&&S.group&&SYM[syncState])?`<span class="mchip ${SYM[syncState][0]}">${SYM[syncState][1]}</span>`:"";

function paintRail(){
  const r=$("#rail");

  $("#railIn").innerHTML=STEPS.map((st,i)=>`<button type="button" data-go="${i}" class="${i===S.step?"on":""} ${stepDone(S,i)?"done":""}" ${canGo(i)?"":"disabled"}><span class="n">${stepDone(S,i)?"✓":i+1}</span>${st.n}</button>`).join("");

function scoreOf(s,rival){
  const c=clientOf(s.group);
  const rec=s.rec.done?(s.rec.tries<=1?15:s.rec.tries===2?10:6):0;
  const hit=s.flags.filter(k=>c.weak.includes(k)).length,fa=s.flags.length-hit;
  const gaps=s.flagsDone?Math.max(0,hit*4-fa*2):0;
  const fixRaw=c.weak.reduce((t,k)=>t+(s.fixes[k]===0?2:s.fixes[k]===1?1:0),0);
  const fix=Math.round(fixRaw/(c.weak.length*2)*15);
  const fails=mgmt(s).filter(x=>!x.ok).length;
  const mg=Math.max(0,15-fails*5);
  const vp=s.prios.filter(p=>c.truePrios.includes(p)).length*5;
  const fy=quote(s).firstYear;let price=10;
  if(rival){const rfy=quote(rival).firstYear; if(fy>0&&rfy>0) price=Math.round(20*Math.min(1,rfy/fy));}
  return {rec,gaps,fix,mg,vp,price,total:rec+gaps+fix+mg+vp+price,fails,fy};
}

  } else if(teacher.tab==="key"){
    body=`<div class="stack">${CLIENTS.map((c,ci)=>{const t=recTruth(c);return `<div class="panel stack"><div class="row" style="justify-content:space-between"><h2>${esc(c.name)}</h2><span class="tag">Groups ${ci*2+1} and ${ci*2+2}</span></div>
     <div class="grid2"><div><h3 style="margin-bottom:6px">Bank reconciliation</h3><table class="tt">${c.rec.items.map(it=>`<tr><td>${esc(it[0])}</td><td class="m">${money(it[1])}</td><td class="m">${SIDES[it[2]]}</td></tr>`).join("")}<tr><td><b>Adjusted bank</b></td><td class="m">${money(t.bank)}</td><td></td></tr><tr><td><b>Adjusted books</b></td><td class="m">${money(t.book)}</td><td></td></tr><tr><td><b>Unexplained gap</b></td><td class="m"><b>${money(t.gap)}</b></td><td></td></tr></table><p class="note" style="margin-top:6px">${esc(c.reveal)}</p></div>
     <div><h3 style="margin-bottom:6px">Control gaps and best fixes</h3><table class="tt">${c.weak.map(k=>`<tr><td><b>${esc(W[k].n)}</b><br><span class="note">${esc(W[k].fix[0])}</span></td></tr>`).join("")}</table><h3 style="margin:12px 0 6px">True priorities</h3><ul class="clean">${c.truePrios.map(id=>`<li>${esc(c.prios.find(p=>p.id===id).t)}</li>`).join("")}</ul></div></div></div>`}).join("")}</div>`;
  } else {
    const ci=teacher.client,c=CLIENTS[ci],g1=ci*2+1,g2=ci*2+2;
    const codeFor=g=>teacher.codes[g]||(teacher.live["g"+g]&&teacher.live["g"+g].code)||"";
    const s1=decode(codeFor(g1)),s2=decode(codeFor(g2));
    const card=(g,s,r)=>{const code=codeFor(g),isLive=!teacher.codes[g]&&!!code;let inner="";
      if(code&&!s) inner=`<p class="no">That code did not load. Ask the group to copy it again.</p>`;
      else if(s&&s.group!==g) inner=`<p class="no">That code belongs to Group ${s.group}, not Group ${g}.</p>`;
      else if(s){const sc=scoreOf(s,r&&r.group===rivalOf(g)?r:null),q=quote(s);
        inner=`<div class="row" style="justify-content:space-between"><div><b style="font-family:var(--display);font-size:20px;text-transform:uppercase">${esc(firmName(s))}</b><div class="note">${esc(s.members.filter(Boolean).join(", "))}</div></div><div class="score">${sc.total}</div></div>
        <table class="tt"><tr><td>Setup</td><td class="m">${money(q.setupPrice)}</td></tr><tr><td>Monthly</td><td class="m">${money(q.recurPrice)}</td></tr><tr><td><b>First year</b></td><td class="m"><b>${money(q.firstYear)}</b></td></tr><tr><td>Management rules</td><td class="m">${sc.fails?`<span class="no">${sc.fails} broken</span>`:'<span class="ok">All met</span>'}</td></tr></table>
        <table class="tt"><tr><td>Bank rec</td><td class="m">${sc.rec}/15</td></tr><tr><td>Control gaps</td><td class="m">${sc.gaps}/20</td></tr><tr><td>Fixes</td><td class="m">${sc.fix}/15</td></tr><tr><td>Management</td><td class="m">${sc.mg}/15</td></tr><tr><td>Value prop</td><td class="m">${sc.vp}/15</td></tr><tr><td>Price</td><td class="m">${sc.price}/20</td></tr></table>
        <div class="row"><button class="btn" type="button" data-tpresent="${g}">Present deck</button><button class="btn ${teacher.picked[ci]===g?"or":"alt"}" type="button" data-win="${g}">${teacher.picked[ci]===g?"Client chose this firm":"Client chooses this firm"}</button></div>`;}
      return `<div class="panel stack"><div class="row" style="justify-content:space-between"><h3>Group ${g} · ${firmOf(g).defName.split(" ")[0]} model</h3>${teacher.picked[ci]===g?'<span class="tag or">Winner</span>':""}</div>${isLive?`<p class="note"><span class="tag good">Live</span> Synced from Group ${g}'s device.</p>`:""}<details ${isLive?"":"open"}><summary class="note">Paste a pitch code instead</summary><label class="f" style="margin-top:6px">Pitch code<textarea data-code="${g}" placeholder="Paste Group ${g}'s pitch code">${esc(teacher.codes[g]||"")}</textarea></label></details>${inner}</div>`;};
    body=`<div class="tabs">${CLIENTS.map((x,i)=>`<button type="button" data-tclient="${i}" class="${i===ci?"on":""}">${esc(x.name.split(" ")[0])} ${teacher.picked[i]?"✓":""}</button>`).join("")}</div><p class="lede" style="margin-bottom:14px">${esc(c.name)}: present each deck, then pick the firm the client hires. Synced decks load on their own; paste a pitch code for any group that is not synced.</p><div class="vs">${card(g1,s1,s2)}${card(g2,s2,s1)}</div>`;
  }
  app.innerHTML=`<div class="head"><span class="eyebrow">Teacher only · not linked on the student site</span><h1>The Engagement</h1><p class="lede">Students go to <b>The Engagement</b> on the site. Each group uses one device.</p></div><div class="tabs">${tabs.map(([k,v])=>`<button type="button" data-ttab="${k}" class="${teacher.tab===k?"on":""}">${v}</button>`).join("")}</div>${body}`;
}

/* ===================== EVENTS ===================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-present],[data-pick]");if(!t)return;
  const d=t.dataset;
  if(d.pick){const g=+d.pick; if(S.group&&S.group!==g){const cc=S.code;S=fresh();S.code=cc;} S.group=g; if(S.step===0&&S.maxStep===0)S.step=-1; view="group"; save(); return render();}
  if(d.resume){view="group";return render();}
  if(d.home){view="home";S.step=-1;save();return render();}
  if(d.go!=null){const i=+d.go; if(i<0){S.step=-1;}else if(i>6)return; else S.step=i; S.maxStep=Math.max(S.maxStep,S.step); save(); return render();}
  if(t.id==="recCheck"){const c=clientOf(S.group);S.rec.tries++;const ok=c.rec.items.every((it,i)=>S.rec.ans[i]===it[2]);if(ok)S.rec.done=true;else if(S.rec.tries>=2)S.rec.showWrong=true;save();return render();}
  if(d.flag){const k=d.flag;S.flags=S.flags.includes(k)?S.flags.filter(x=>x!==k):[...S.flags,k];save();return vWalkKeep();}
  if(t.id==="flagSubmit"){S.flagsDone=true;save();return render();}
  if(d.fix){S.fixes[d.fix]=+d.i;save();return keepScroll(()=>vFix($("#app")));}
  if(d.prio){const k=d.prio;if(S.prios.includes(k))S.prios=S.prios.filter(x=>x!==k);else if(S.prios.length<3)S.prios=[...S.prios,k];save();return keepScroll(()=>vValue($("#app")));}
  if(d.str){const k=d.str;if(S.strengths.includes(k))S.strengths=S.strengths.filter(x=>x!==k);else if(S.strengths.length<2)S.strengths=[...S.strengths,k];save();return keepScroll(()=>vValue($("#app")));}
  if(d.rw){S.rivalW=S.rivalW===d.rw?null:d.rw;save();return keepScroll(()=>vValue($("#app")));}
  if(d.present!=null){return present(S,+d.present);}
  if(d.pnav){pres.i=Math.min(pres.slides.length-1,Math.max(0,pres.i+ +d.pnav));return paintPresent();}
  if(d.pclose){return closePresent();}
  if(t.id==="copyCode"){const ta=$("#codeOut");const msg=$("#copyMsg");try{navigator.clipboard.writeText(ta.value).then(()=>msg.textContent="Copied.",()=>{ta.select();msg.textContent="Selected. Press Ctrl+C to copy.";});}catch(err){ta.select();msg.textContent="Selected. Press Ctrl+C to copy.";}return;}
  if(t.id==="resetAsk"){$("#resetZone").innerHTML=`<span class="confirm">Erase all work for Group ${S.group} on this device? <button class="btn" type="button" id="resetYes">Erase</button><button class="btn alt" type="button" id="resetNo">Keep</button></span>`;return;}
  if(t.id==="resetNo"){return render();}
  if(t.id==="resetYes"){const cc=S.code;S=fresh();S.code=cc;view="home";save();return render();}
  if(t.id==="tStart"){return startSession();}
  if(t.id==="tEnd"){teacher.confirmEnd=true;return render();}
  if(t.id==="tEndNo"){teacher.confirmEnd=false;return render();}
  if(t.id==="tEndYes"){const c=teacher.session;liveCall("remove","games/"+c).catch(()=>{});teacher.session="";teacher.live={};teacher.confirmEnd=false;saveT();return render();}
  if(t.id==="pinGo"){const v=($("#pin").value||"").trim().toLowerCase();if(v==="husky"){teacher.unlocked=true;render();}else $("#pinMsg").textContent="That PIN is not right.";return;}
  if(d.ttab){teacher.tab=d.ttab;return render();}
  if(d.tclient!=null){teacher.client=+d.tclient;return render();}
  if(d.tpresent){const g=d.tpresent,s=decode(teacher.codes[g]||(teacher.live["g"+g]&&teacher.live["g"+g].code));if(s)present(s,0);return;}
  if(d.win){const g=+d.win;teacher.picked[teacher.client]=teacher.picked[teacher.client]===g?null:g;saveT();return keepScroll(render);}
});
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo({top:y});paintMast();paintRail();}
function vWalkKeep(){keepScroll(()=>vWalk($("#app")));}
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.rec!=null){S.rec.ans[d.rec]=t.value||undefined;if(!t.value)delete S.rec.ans[d.rec];save();return keepScroll(()=>vRec($("#app")));}
  if(d.sel){S.sel[d.sel]=t.checked;save();$("#row-"+d.sel).classList.toggle("off",!t.checked);return paintPriceSum();}
});
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="firmName"){S.firm=t.value;return save();}
  if(t.id==="classCode"){S.code=t.value.replace(/\D/g,"").slice(0,4);t.value=S.code;save();const sm=$("#syncMsg");if(sm)sm.innerHTML=syncNote();return;}
  if(d.mem!=null){S.members[+d.mem]=t.value;return save();}
  if(t.id==="headline"){S.headline=t.value;S.headEdited=true;return save();}
  if(d.price){const v=SERVICES.find(x=>x.id===d.price),p=+t.value;S.price[v.id]=p;const cost=svcCost(S,v);$("#p-"+v.id).textContent=money(p);$("#m-"+v.id).textContent=pct((p-cost)/p);save();return paintPriceSum();}
  if(d.code){teacher.codes[d.code]=t.value;saveT();clearTimeout(window.__ct);window.__ct=setTimeout(()=>{const ae=document.activeElement&&document.activeElement.dataset.code;render();if(ae){const el=document.querySelector(`[data-code="${ae}"]`);if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length;}}},400);}
});
document.addEventListener("keydown",e=>{
  if(pres){if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();pres.i=Math.min(pres.slides.length-1,pres.i+1);paintPresent();}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();pres.i=Math.max(0,pres.i-1);paintPresent();}
    else if(e.key==="Escape")closePresent();return;}
  if(e.key==="Enter"&&e.target.matches&&e.target.matches(".slide[data-present]"))present(S,+e.target.dataset.present);
  if(e.key==="Enter"&&e.target.id==="pin")$("#pinGo").click();
});
async function startSession(){
  const msg=$("#tMsg");
  for(let i=0;i<6;i++){
    const code=String(1000+Math.floor(Math.random()*9000));
    try{const r=await liveCall("set","games/"+code,{kind:"engagement",t:Date.now()});
      if(r.ok){teacher.session=code;teacher.live={};saveT();render();return;}
      if(r.status!==409){if(msg)msg.textContent="Could not start a session ("+(r.j.error||r.status)+").";return;}
    }catch(e){if(msg)msg.textContent="Could not reach the server.";return;}
  }
  if(msg)msg.textContent="Could not find a free code. Try again.";
}
let lastLive="";
async function pollLive(){
  if(teacher.session&&!document.hidden){
    try{const r=await liveCall("get","games/"+teacher.session+"/players");
      if(r.ok){const v=r.j.v||{},s=JSON.stringify(v);
        if(s!==lastLive){lastLive=s;teacher.live=v;
          const typing=document.activeElement&&document.activeElement.tagName==="TEXTAREA";
          if(view==="teacher"&&!pres&&!typing&&(teacher.tab==="live"||teacher.tab==="board"))keepScroll(render);}}
    }catch(e){}
  }
  setTimeout(pollLive,3000);
}
async function initTeacher(){
  try{const r=await liveCall("ping");teacher.netOk=!!(r.ok&&r.j.ok);}catch(e){teacher.netOk=false;}
  if(teacher.netOk&&teacher.session){
    try{const r=await liveCall("get","games/"+teacher.session);if(r.ok&&r.j.v==null){teacher.session="";saveT();}}catch(e){}
  }
  render();pollLive();
}
render();
if(ROLE==="teacher")initTeacher();else if(S.code&&S.group)queueSync();
</script>
<!-- Text size controls: scale the page content, remembered across pages -->
<style id="tsz-css">
#tsz{position:fixed;left:14px;bottom:14px;z-index:9999;display:flex;align-items:center;gap:2px;background:#111;color:#fff;border-radius:999px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.3);font:600 15px "Barlow",system-ui,sans-serif}
#tsz button{background:transparent;border:0;color:#fff;font:inherit;cursor:pointer;border-radius:999px;min-width:40px;height:36px;padding:0 10px}
#tsz button:hover{background:rgba(255,255,255,.15)}
#tsz button:focus-visible{outline:3px solid #C1102F;outline-offset:1px}
#tsz button:disabled{opacity:.35;cursor:default}
#tsz .big{font-size:20px}
#tsz .pct{min-width:58px;font-variant-numeric:tabular-nums}
@media print{#tsz{display:none}}
</style>
<div id="tsz" role="group" aria-label="Text size">
  <button type="button" data-d="-1" aria-label="Smaller text" title="Smaller text (-)">A−</button>
  <button type="button" data-d="0" class="pct" aria-label="Reset text size" title="Reset text size (0)">100%</button>
  <button type="button" data-d="1" class="big" aria-label="Bigger text" title="Bigger text (+)">A+</button>
</div>
<script>
(function(){
  var STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6,1.8,2],KEY="d214-text-size",box=document.getElementById("tsz");
  var target=document.querySelector("main")||document.body;
  var i=2;try{var v=parseFloat(localStorage.getItem(KEY));var j=STEPS.indexOf(v);if(j>=0)i=j}catch(e){}
  function apply(){
    var z=STEPS[i];target.style.zoom=z;
    box.style.zoom=target===document.body?1/z:1;
    box.children[1].textContent=Math.round(z*100)+"%";
    box.children[0].disabled=i===0;box.children[2].disabled=i===STEPS.length-1;
    try{localStorage.setItem(KEY,z)}catch(e){}
  }
  function step(d){i=d===0?2:Math.max(0,Math.min(STEPS.length-1,i+d));apply()}
  box.addEventListener("click",function(e){var b=e.target.closest("button");if(b){step(+b.dataset.d);b.blur()}});
  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey)return;var t=e.target.tagName;if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
    if(e.key==="+"||e.key==="=")step(1);else if(e.key==="-"||e.key==="_")step(-1);else if(e.key==="0")step(0);
  });
  apply();
})();
</script>
